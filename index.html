
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Egg Timer</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background-image:
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
        url("file:///D:/download/Egg/Background.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #443322;
}

.main-container {
    width: min(90%, 690px);
    padding: 45px;
    text-align: center;
    background: rgba(40,32,24,0.75);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 32px;
    backdrop-filter: blur(10px);
}

h1 {
    color: #fff8ed;
    font-size: 42px;
    margin-bottom: 15px;
}

.subtitle {
    color: #e8ddcb;
    margin-bottom: 35px;
    font-size: 17px;
}

.egg-buttons {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.egg-buttons button {
    padding: 22px;
    border: none;
    border-radius: 16px;
    background: #f8eddb;
    color: #443322;
    font-size: 21px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.25s;
}

.egg-buttons button:hover {
    background: #78865b;
    color: white;
    transform: scale(1.03);
}

/* POPUPS */

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 15px;
    z-index: 10;
}

.popup {
    position: relative;
    width: min(100%, 525px);
    max-height: 92vh;
    overflow-y: auto;
    background: #fff9ef;
    border-radius: 32px;
    padding: 35px 30px;
    text-align: center;
    animation: appear 0.25s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(0.9);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.close-btn {
    position: absolute;
    top: 18px;
    right: 22px;
    background: none;
    border: none;
    font-size: 30px;
    cursor: pointer;
    color: #402d1c;
}

.popup h2 {
    font-size: 34px;
    margin: 10px 0 20px;
}

/* EGG IMAGE */

.egg-image {
    width: 220px;
    height: 220px;
    object-fit: contain;
    display: block;
    margin: 10px auto 20px;
}

.description {
    font-size: 18px;
    color: #8a684b;
    margin: 15px 0;
    line-height: 1.5;
}

.duration {
    font-size: 23px;
    font-weight: bold;
    margin: 20px 0 15px;
}

.action-btn {
    padding: 17px 35px;
    border: none;
    border-radius: 15px;
    background: #6f7d50;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.action-btn:hover {
    background: #58663c;
    transform: scale(1.04);
}

/* TIMER */

.timer-circle {
    width: 260px;
    height: 260px;
    margin: 15px auto 20px;
    position: relative;
}

.timer-circle svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
}

.timer-circle circle {
    fill: none;
    stroke-width: 9;
}

.timer-track {
    stroke: #e6ddcf;
}

.timer-progress {
    stroke: #78865b;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear;
}

.timer-center {
    position: absolute;
    inset: 25px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.timer-center img {
    width: 105px;
    height: 105px;
    object-fit: contain;
    margin-bottom: 5px;
}

.time-display {
    font-size: 32px;
    font-weight: bold;
    color: #443322;
}

.timer-controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 15px;
}

.secondary-btn {
    padding: 14px 22px;
    border: none;
    border-radius: 12px;
    background: #e8ddcb;
    color: #443322;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.secondary-btn:hover {
    background: #d8cbb8;
}

@media(max-width: 500px) {
    .main-container {
        padding: 28px 20px;
    }

    h1 {
        font-size: 32px;
    }

    .popup {
        padding: 35px 20px;
    }

    .egg-image {
        width: 190px;
        height: 190px;
    }

    .timer-circle {
        width: 230px;
        height: 230px;
    }
}
</style>
</head>

<body>

<div class="main-container">

    <h1>🥚 Egg Timer</h1>

    <p class="subtitle">
        Choose your perfect boiled egg!
    </p>

    <div class="egg-buttons">
        <button onclick="selectEgg('soft')">Soft Boil</button>
        <button onclick="selectEgg('medium')">Medium Boil</button>
        <button onclick="selectEgg('hard')">Hard Boil</button>
    </div>

</div>

<!-- EGG INFORMATION POPUP -->

<div class="overlay" id="eggOverlay">
    <div class="popup">

        <button class="close-btn" onclick="closeEggPopup()">×</button>

        <h2 id="eggTitle">Soft Boil</h2>

        <img
            id="eggImage"
            class="egg-image"
            src="file:///D:/download/Egg/Soft.png"
            alt="Selected boiled egg"
        >

        <p class="description" id="eggDescription"></p>

        <p class="duration" id="eggDuration"></p>

        <button class="action-btn" onclick="startTimer()">
            Start Timer
        </button>

    </div>
</div>

<!-- TIMER POPUP -->

<div class="overlay" id="timerOverlay">
    <div class="popup">

        <button class="close-btn" onclick="closeTimerPopup()">×</button>

        <h2 id="timerTitle">Soft Boil Timer</h2>

        <div class="timer-circle">

            <svg viewBox="0 0 240 240">

                <circle
                    class="timer-track"
                    cx="120"
                    cy="120"
                    r="110"
                ></circle>

                <circle
                    class="timer-progress"
                    id="progressRing"
                    cx="120"
                    cy="120"
                    r="110"
                ></circle>

            </svg>

            <div class="timer-center">

                <img
                    id="timerEggImage"
                    src="file:///D:/download/Egg/Soft.png"
                    alt="Boiled egg"
                >

                <div class="time-display" id="timeDisplay">
                    06:00
                </div>

            </div>

        </div>

        <p class="description" id="timerStatus">
            Your egg is cooking!
        </p>

        <div class="timer-controls">

            <button class="action-btn" id="pauseBtn" onclick="pauseResumeTimer()">
                Pause
            </button>

            <button class="secondary-btn" onclick="resetTimer()">
                Reset
            </button>

        </div>

    </div>
</div>

<script>

// EGG SETTINGS

const eggs = {

    soft: {
        name: "Soft Boil",
        image: "file:D:/download/Egg/Soft.jpg",
        description: "A soft white with a delicious runny golden yolk.",
        minutes: 6
    },

    medium: {
        name: "Medium Boil",
        image: "file:D:/download/Egg/Medium.jpg",
        description: "A perfectly cooked egg with a slightly creamy yolk.",
        minutes: 7
    },

    hard: {
        name: "Hard Boil",
        image: "file:D:/download/Egg/Hard.jpg",
        description: "A fully cooked egg with a firm golden yolk.",
        minutes: 10
    }

};

let selectedEgg = null;
let totalSeconds = 0;
let remainingSeconds = 0;
let timerInterval = null;
let isPaused = false;

const circumference = 2 * Math.PI * 110;

const progressRing = document.getElementById("progressRing");

progressRing.style.strokeDasharray = circumference;
progressRing.style.strokeDashoffset = 0;


// SELECT EGG

function selectEgg(type) {

    selectedEgg = eggs[type];

    document.getElementById("eggTitle").textContent =
        selectedEgg.name;

    document.getElementById("eggImage").src =
        selectedEgg.image;

    document.getElementById("eggDescription").textContent =
        selectedEgg.description;

    document.getElementById("eggDuration").textContent =
        selectedEgg.minutes + " Minutes";

    document.getElementById("eggOverlay").style.display = "flex";

}


// CLOSE EGG POPUP

function closeEggPopup() {

    document.getElementById("eggOverlay").style.display = "none";

}


// START TIMER

function startTimer() {

    if (!selectedEgg) return;

    clearInterval(timerInterval);

    totalSeconds = selectedEgg.minutes * 60;
    remainingSeconds = totalSeconds;

    isPaused = false;

    document.getElementById("eggOverlay").style.display = "none";
    document.getElementById("timerOverlay").style.display = "flex";

    document.getElementById("timerTitle").textContent =
        selectedEgg.name + " Timer";

    document.getElementById("timerEggImage").src =
        selectedEgg.image;

    document.getElementById("pauseBtn").textContent = "Pause";

    document.getElementById("timerStatus").textContent =
        "Your egg is cooking!";

    updateTimerDisplay();

    timerInterval = setInterval(countdown, 1000);

}


// COUNTDOWN

function countdown() {

    if (remainingSeconds > 0) {

        remainingSeconds--;

        updateTimerDisplay();

    } else {

        clearInterval(timerInterval);
        timerInterval = null;

        document.getElementById("timerStatus").textContent =
            "Your egg is ready! Enjoy! 🥚";

        document.getElementById("pauseBtn").textContent =
            "Finished";

        playAlarm();

    }

}


// UPDATE TIMER DISPLAY

function updateTimerDisplay() {

    let minutes = Math.floor(remainingSeconds / 60);
    let seconds = remainingSeconds % 60;

    document.getElementById("timeDisplay").textContent =
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");

    let progress = remainingSeconds / totalSeconds;

    let offset = circumference * (1 - progress);

    progressRing.style.strokeDashoffset = offset;

}


// PAUSE AND RESUME

function pauseResumeTimer() {

    if (remainingSeconds <= 0) return;

    if (isPaused) {

        timerInterval = setInterval(countdown, 1000);

        document.getElementById("pauseBtn").textContent = "Pause";

        document.getElementById("timerStatus").textContent =
            "Your egg is cooking!";

        isPaused = false;

    } else {

        clearInterval(timerInterval);
        timerInterval = null;

        document.getElementById("pauseBtn").textContent = "Resume";

        document.getElementById("timerStatus").textContent =
            "Timer paused.";

        isPaused = true;

    }

}


// RESET TIMER

function resetTimer() {

    if (!selectedEgg) return;

    clearInterval(timerInterval);
    timerInterval = null;

    remainingSeconds = totalSeconds;
    isPaused = false;

    document.getElementById("pauseBtn").textContent = "Pause";

    document.getElementById("timerStatus").textContent =
        "Your egg is cooking!";

    updateTimerDisplay();

    timerInterval = setInterval(countdown, 1000);

}


// CLOSE TIMER POPUP

function closeTimerPopup() {

    clearInterval(timerInterval);
    timerInterval = null;

    document.getElementById("timerOverlay").style.display = "none";

}


// ALARM SOUND

function playAlarm() {

    try {

        const audioContext = new (
            window.AudioContext || window.webkitAudioContext
        )();

        for (let i = 0; i < 3; i++) {

            let oscillator = audioContext.createOscillator();
            let gain = audioContext.createGain();

            oscillator.connect(gain);
            gain.connect(audioContext.destination);

            oscillator.frequency.value = 800;
            oscillator.type = "sine";

            let start = audioContext.currentTime + i * 0.5;

            gain.gain.setValueAtTime(0.3, start);

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                start + 0.35
            );

            oscillator.start(start);
            oscillator.stop(start + 0.35);

        }

    } catch (error) {

        console.log("Alarm sound unavailable:", error);

    }

}

</script>

</body>
</html>
